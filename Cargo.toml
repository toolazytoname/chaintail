[package]
name = "chaintail"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first, read-only chain event tail (CLI + SQLite)"
repository = "https://github.com/toolazytoname/chaintail"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "=2.9.7", default-features = false, features = ["tls", "json"] }
url = "=2.5.2"

[dev-dependencies]
tempfile = "3.14"
